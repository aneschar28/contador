
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ticket Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="maincontainer">

        <!-- HEADER -->
        <header class="header">

            <div class="titulo">
                <h2>Ticket Dashboard</h2>
                <p>Activity Tracking Dashboard</p>
            </div>

            <div class="productivity-display">
                <span>TOTAL PRODUCTIVITY</span>
                <h2 id="productivity">0</h2>
            </div>

            <div class="agente">

                <div class="agent-icon">
                    <span>👤</span>
                </div>

                <div class="agent-data">
                    <span class="etiqueta">ACTIVE AGENT</span>
                    <h3 id="userNameDisplay"></h3>
                </div>

            </div>

        </header>


        <!-- PERFORMANCE -->
        <div class="performance-card">

            <!-- TICKET PERFORMANCE -->
            <section class="ticket-performance">

                <div class="performance-info">

                    <div>
                        <span>YOUR TICKETS</span>
                        <h2 id="progress-info">0</h2>
                    </div>

                    <div class="goal">
                        <span>GOAL</span>
                        <h4>25 tickets</h4>
                    </div>

                </div>

                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>

                <div class="progress-details">
                    <span id="progress-details">0% achieved</span>
                    <span class="goal-status" id="goal-status">Goal not reached</span>
                </div>

            </section>


            <!-- COMPARISON WITH TOP AGENT -->
            <section class="agent-comparison">

                <h3>Comparison with top agent</h3>

                <div class="comparison-info">
                    <h2 id="best-performance">0</h2>
                </div>

                <div class="progress-bar">
                    <div class="progress-fill" id="best-progress-fill"></div>
                </div>

                <div class="comparison-details">
                    <span id="best-progress-details">0% of top agent</span>
                </div>

            </section>

        </div>


        <!-- INPUT TICKET -->
        <section class="ticket-section">

            <input
                type="text"
                id="myInput"
                placeholder="Enter the ticket number"
            >

            <div class="info-container">

                <button class="info-button">More info</button>

                <div id="info-box">
                    <p></p>
                </div>

            </div>

        </section>


        <!-- COUNTERS -->
        <section class="dashboard">

            <!-- SOLVED -->
            <div class="card solved">

                <span class="card-icon">✓</span>

                <h1 id="solvedQuantity">0</h1>
                <h3>Tickets handled</h3>

                <div class="actions">
                    <button id="addSolved">+</button>
                </div>

            </div>


            <!-- CHATS -->
            <div class="card chats">

                <span class="card-icon">💬</span>

                <h1 id="chatsQuantity">0</h1>
                <h3>Chats</h3>

                <div class="actions">
                    <button id="addChats">+</button>
                </div>

            </div>


            <!-- OUTBOUND -->
            <div class="card outbound">

                <span class="card-icon">↗</span>

                <h1 id="outboundQuantity">0</h1>
                <h3>Calls</h3>

                <div class="actions">
                    <button id="addOutbound">+</button>
                </div>

            </div>

        </section>


        <!-- RESET MEMORY -->
        <div class="reset-container">

            <button id="resetmemory" class="reset-memory">
                ↻ Reset Memory
            </button>

        </div>

    </main>


    <script src="code.js"></script>

</body>
</html>

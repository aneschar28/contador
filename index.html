<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Contador</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div>
        <div class="solved">
            <h1 id="cantidad_Solved">0</h1>
        </div>
        
        <button id="sumar_Solved">+</button>
        <button id="restar_Solved">-</button>
        <button id="reiniciar_Solved">Reiniciar</button>

    </div>

    <div>
        <div class="pending">
            <h1 id="contador_Pending">0</h1>
        </div>
        
        <button id="sumar_Pending">+</button>
        <button id="restar_Pending">-</button>
        <button id="reiniciar_Pending">Reiniciar</button>
        
    </div>

    <div>
        <div class="hold">
            <h1 id="contador_Hold">0</h1>
        </div>
        
        <button id="sumar_Hold"">+</button>
        <button id="restar_Hold"">-</button>
        <button id="reiniciar_Hold"">Reiniciar</button>
        
    </div>

    <div>
        <div class="chats">
            <h1 id="contador_Chats">0</h1>
        </div>
        
        <button id="sumar_Chats">+</button>
        <button id="restar_Chats">-</button>
        <button id="reiniciar_Chats">Reiniciar</button>
        
    </div>

    <div>
        <div class="outbound">
            <h1 id="contador_Outbound">0</h1>
        </div>
        
        <button id="sumar_Outbound">+</button>
        <button id="restar_Outbound">-</button>
        <button id="reiniciar_Outbound">Reiniciar</button>
        
    </div>

    <div>
        <div class="inbound">
            <h1 id="contador_Inbound">0</h1>
        </div>
        
        <button id="sumar_Inbound">+</button>
        <button id="restar_Inbound">-</button>
        <button id="reiniciar_Inbound">Reiniciar</button>
        
    </div>


</body>
<script src="code.js"></script>
</html>

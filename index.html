
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ticket Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="maincontainer"> 

        <!-- HEADER -->
        <header class="header">

        <div class="titulo"> <!-- titulo -->
                <h2>Ticket Dashboard</h2>
                <p>Activity Tracking Dashboard</p>
            </div>

            <div class="agente"> 

                <div class="agent-icon"> 
                    <span>👤</span>
                </div>

                <div class="agent-data"> 
                    <span class="etiqueta">ACTIVE AGENT</span> 
                    <h3 id="userNameDisplay"></h3>
                </div>

            </div>

        </header>


        <!-- INPUT TICKET -->
        <section class="ticket-section">

            <label for="myInput">Ticket number</label> 

            <input
                type="text"
                id="myInput"
                placeholder="Enter the ticket number"
            >

        </section>


        <!-- CONTADORES -->
        <section class="dashboard">


            <div class="card solved">

                <span class="card-icon">✉</span>

                <h1 id="solvedQuantity">0</h1>
                <h3>ticket handled</h3>

                <div class="actions"> 
                    <button id="addSolved">+</button>
            
                </div>

            </div>

            <div class="card chats">

                <span class="card-icon"><i data-lucide="message-square">💬</i></span>

                <h1 id="chatsQuantity">0</h1>
                <h3>Chats</h3>

                <div class="actions"> 
                    <button id="addChats">+</button>
                    
                </div>

            </div>


            <div class="card outbound">

                <span class="card-icon">☎</span>

                <h1 id="outboundQuantity">0</h1>
                <h3>Calls</h3>

                <div class="actions"> 
                    <button id="addOutbound">+</button>
                    
                </div>

            </div>

        </section>


        <!-- RESET MEMORY -->
        <div class="reset-container">

            <button id="resetmemory" class="reset-memory">
                ↻ Reset Memory
            </button>

        </div>


    </main>


    <script src="code.js"></script>

</body>
</html>
